<script>
// ─── Supabase setup ──────────────────────────────────────────────────────
const SUPABASE_URL = 'https://qglwcaxfwbofstaxzzvb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cyN019dDWoyecfjrp755ag_4yBT3WMM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
});
window._sb = sb;

// ─── Login screen logic ──────────────────────────────────────────────────
var _pwVisible = false;
var _mode = 'signin'; // 'signin' | 'signup'

function togglePw(){
  var i = document.getElementById('inp-pass'), b = document.getElementById('pw-btn');
  _pwVisible = !_pwVisible;
  i.type = _pwVisible ? 'text' : 'password';
  b.textContent = _pwVisible ? 'Hide' : 'Show';
}

function toggleMode(){
  _mode = _mode === 'signin' ? 'signup' : 'signin';
  document.getElementById('login-btn').textContent = _mode === 'signin' ? 'Sign In' : 'Create Account';
  document.getElementById('login-toggle-text').textContent = _mode === 'signin' ? 'First time?' : 'Already have an account?';
  document.getElementById('login-toggle-link').textContent = _mode === 'signin' ? 'Create account' : 'Sign in';
  setMsg('','');
}

function setMsg(text, cls){
  var m = document.getElementById('login-msg');
  m.textContent = text;
  m.className = 'login-msg' + (cls ? ' ' + cls : '');
}

async function doAuth(){
  var email = document.getElementById('inp-email').value.trim();
  var pass = document.getElementById('inp-pass').value;
  var btn = document.getElementById('login-btn');
  if(!email || !pass){ setMsg('Email and password required','err'); return; }
  if(_mode === 'signup' && pass.length < 6){ setMsg('Password must be at least 6 characters','err'); return; }
  btn.disabled = true;
  setMsg(_mode === 'signin' ? 'Signing in…' : 'Creating account…','');
  try {
    var result;
    if(_mode === 'signin'){
      result = await sb.auth.signInWithPassword({ email, password: pass });
    } else {

// TAX ENGINE — Stage 3 (FY2024-25+) with LITO, Medicare, indexation
// ═══════════════════════════════════════════════════════════════
function calcTax(taxable, opts) {
  opts = opts || {};
  const idx = opts.bracketIndex || 0;
  const yrs = opts.yearsFromBase || 0;
  const m = Math.pow(1+idx, yrs);
  const t = Math.max(0, taxable);
  let tax = 0;
  if (t <= 18200*m) tax = 0;
  else if (t <= 45000*m) tax = (t - 18200*m) * 0.16;
  else if (t <= 135000*m) tax = (45000-18200)*m*0.16 + (t - 45000*m) * 0.30;
  else if (t <= 190000*m) tax = (45000-18200)*m*0.16 + (135000-45000)*m*0.30 + (t - 135000*m) * 0.37;
  else tax = (45000-18200)*m*0.16 + (135000-45000)*m*0.30 + (190000-135000)*m*0.37 + (t - 190000*m) * 0.45;
  let medicare = 0;
  const mcLo = 27222*m, mcHi = 34028*m;
  if (t > mcHi) medicare = t * 0.02;
  else if (t > mcLo) medicare = (t - mcLo) * 0.10;
  let lito = 0;
  const lA = 37500*m, lB = 45000*m, lC = 66667*m;
  if (t <= lA) lito = 700;
  else if (t <= lB) lito = 700 - (t - lA) * 0.05;
  else if (t <= lC) lito = 325 - (t - lB) * 0.015;
  lito = Math.max(0, lito);
  return Math.max(0, tax + medicare - lito);
}

function marginalRate(taxable, opts) {
  opts = opts || {};
  const idx = opts.bracketIndex || 0;
  const yrs = opts.yearsFromBase || 0;
  const m = Math.pow(1+idx, yrs);
  const t = Math.max(0, taxable);
  if (t <= 18200*m) return 0;
  if (t <= 45000*m) return 0.16 + 0.02;
  if (t <= 135000*m) return 0.30 + 0.02;
  if (t <= 190000*m) return 0.37 + 0.02;
  return 0.45 + 0.02;
}

function vicStampDuty(price) {
  if (price <= 25000) return price*0.014;
  if (price <= 130000) return 350+(price-25000)*0.024;
  if (price <= 960000) return 2870+(price-130000)*0.06;
  if (price <= 2000000) return price*0.055;
  return price*0.065;
}

const SyncCtx = createContext({status:'synced', userId:null});

function SyncProvider({children}) {
  const [status, setStatus] = useState('synced'); // synced | saving | offline | error
  const [userId, setUserId] = useState(null);
  const [hydrated, setHydrated] = useState(false);
  const debounceRef = useRef(null);
  const pendingRef = useRef(null);

  // Get user, then pull blob from Supabase (overwrites local — per your choice)
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const { data: sess } = await window._sb.auth.getSession();
        if(!sess || !sess.session || cancelled) return;
        const uid = sess.session.user.id;
        setUserId(uid);
        // Pull existing row
        const { data: row, error } = await window._sb
          .from('user_state').select('data').eq('user_id', uid).maybeSingle();
        if(cancelled) return;
        if(error){ console.warn('Pull failed:', error); setStatus('error'); return; }
        if(row && row.data && Object.keys(row.data).length > 0){
          // Hydrate localStorage from Supabase (source of truth)
          if(row.data.FinancePlan_A) localStorage.setItem('FinancePlan_A', JSON.stringify(row.data.FinancePlan_A));
          if(row.data.FinancePlan_D) localStorage.setItem('FinancePlan_D', JSON.stringify(row.data.FinancePlan_D));
          if(row.data.FinancePlan_T) localStorage.setItem('FinancePlan_T', JSON.stringify(row.data.FinancePlan_T));
        } else {
          // First sign-in for this user: push current local state up
          await pushBlob(uid);
        }
      } catch(e){
        console.warn('Sync init error:', e);
        setStatus('error');
      } finally {
        if(!cancelled) setHydrated(true);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  async function pushBlob(uid) {
    const blob = {
      FinancePlan_A: JSON.parse(localStorage.getItem('FinancePlan_A') || 'null'),
      FinancePlan_D: JSON.parse(localStorage.getItem('FinancePlan_D') || 'null'),
      FinancePlan_T: JSON.parse(localStorage.getItem('FinancePlan_T') || 'null'),
    };
    const { error } = await window._sb.from('user_state')
      .upsert({ user_id: uid, data: blob, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
    if(error){ setStatus('error'); console.warn('Push failed:', error); return false; }
    return true;
  }

  // Public method called by state providers on change
  const schedulePush = useCallback(() => {
    if(!userId || !hydrated) return;
    if(!navigator.onLine){ setStatus('offline'); return; }
    setStatus('saving');
    if(debounceRef.current) clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(async () => {
      const ok = await pushBlob(userId);
      if(ok) setStatus('synced');
    }, 1500);
  }, [userId, hydrated]);

  // Online/offline listeners
  useEffect(() => {
    const onOnline = () => { if(userId) schedulePush(); };
    const onOffline = () => setStatus('offline');
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    return () => { window.removeEventListener('online', onOnline); window.removeEventListener('offline', onOffline); };
  }, [userId, schedulePush]);

  return React.createElement(SyncCtx.Provider, {value:{status, userId, hydrated, schedulePush}}, children);
}

function pmt(rate, nper, pv) {
  if(rate===0) return pv/nper;
  return pv*rate*Math.pow(1+rate,nper) / (Math.pow(1+rate,nper)-1);
}

function computeLife(D) {
  const rows = [];
  const stamp = vicStampDuty(D.pporPrice);
  const deposit = D.pporPrice * D.depositPct;
  const loan = D.pporPrice - deposit;
  const totalCosts = deposit + stamp + D.legal;
  const startOffset = D.totalCash - totalCosts;
  const annualRepay = pmt(D.mortgageRate/12, D.mortgageTerm*12, loan) * 12;
  const etfNet = D.etfGross - D.etfFees;
  const cpi = (base, yrs) => base * Math.pow(1+D.cpiRate, yrs);
  const taxOpts = yrs => ({bracketIndex:D.bracketIndex, yearsFromBase:yrs});

  function salaryGross(age) {
    if(age===31) return D.sal31;
    if(age===32) return D.sal32;
    if(age===33) return D.sal33;
    if(age===34) return D.sal34;
    return D.sal34 * Math.pow(1+D.salGrowth, age-34);
  }
  function wifeSalaryGross(age) {
    if(age===31) return D.wifeSal31 ?? D.sal31;
    if(age===32) return D.wifeSal32 ?? D.sal32;
    if(age===33) return D.wifeSal33 ?? D.sal33;
    if(age===34) return D.wifeSal34 ?? D.sal34;
    return (D.wifeSal34 ?? D.sal34) * Math.pow(1+(D.wifeSalGrowth ?? D.salGrowth), age-34);
  }
  function childMonthly(age, yrs) {
    const ua = 2028 + (age - 31) - D.uzielBirthYear;
    if(ua < 4) return cpi(D.kidsActivities, yrs)*12;
    if(ua <= 5) return cpi(D.childcare + D.kidsActivities, yrs)*12;
    if(ua <= 12) return cpi(D.primary + D.kidsActivities, yrs)*12;
    if(ua <= 17) return cpi(D.highSchool + D.kidsActivities, yrs)*12;
    return D.uzielETF*12;
  }

  const coreMonthly = D.groceries+D.utilities+D.phone+D.streaming+D.clothing+D.eatOut+D.gifts;
  const propMonthly = D.council+D.water+D.buildingIns+D.maintenance+D.strata+D.garden+D.otherHouse;
  const veh1Monthly = D.carFuel+D.carIns+D.carRego+D.carService+D.carReplace;
  const insMonthly = D.healthIns+D.lifeIns+D.incomeProtect+D.trauma;
  const savMonthly = D.travel+D.healthcare+D.christmas;

  const lecMap = {};
  (D.lifeEvents||[]).forEach(e => {
    const yrs = e.age - D.startAge;
    const amt = e.cpiLinked === false ? e.amount : e.amount * Math.pow(1+D.cpiRate, yrs);
    lecMap[e.age] = (lecMap[e.age]||0) + amt;
  });
  const extraIncMap = {}, extraExpMap = {};
  (D.extraIncome||[]).forEach(r => { for(let a=r.ageFrom; a<=r.ageTo; a++) extraIncMap[a] = (extraIncMap[a]||0)+r.monthlyAmount*12; });
  (D.extraExpense||[]).forEach(r => { for(let a=r.ageFrom; a<=r.ageTo; a++) extraExpMap[a] = (extraExpMap[a]||0)+r.monthlyAmount*12; });

  let offset = startOffset, etf = 0;
  let superBal = D.superYou + D.superPartner;
  let ipVal = 0, ipLoan = 0, ipEquity = 0;
  let pporVal = D.pporPrice;
  let remainLoan = loan;

  for(let age = D.startAge; age <= 65; age++) {
    const year = 2028 + (age - D.startAge);
    const yrs = age - D.startAge;
    const opts = taxOpts(yrs);
    const grossSal = salaryGross(age);
    const wifeGrossSal = wifeSalaryGross(age);

    // IP cashflow (Strategy 3)
    let ipNetCF = 0, ipRent = 0, ipInt = 0, ipExpInfl = 0;
    if(D.strategy===3 && age >= D.ipPurchaseAge) {
      if(ipLoan===0 && age === D.ipPurchaseAge) {
        const ipDep = D.ipPrice * D.ipDepositPct;
        const ipStamp = vicStampDuty(D.ipPrice);
        ipLoan = D.ipPrice - ipDep;
        ipVal = D.ipPrice;
        offset -= (ipDep + ipStamp + D.ipLegal);
      }
      ipRent = ipVal * D.ipGrossYield;
      ipInt = ipLoan * D.ipLoanRate;
      ipExpInfl = D.ipExpenses * Math.pow(1+D.cpiRate, age - D.ipPurchaseAge);
      ipNetCF = ipRent - ipInt - ipExpInfl;
    }

    // ETF dividends (taxable each year)
    const etfDiv = Math.max(0, etf) * D.etfDividendYield;
    const frankingCredits = etfDiv * D.frankingPortion * (0.30/0.70);

    const sideGross = D.sideIncome * 12;
    const extraIncGross = extraIncMap[age] || 0;

    // Split investment income/loss by IP owner
    const split = D.ipOwner==='joint' ? 0.5 : (D.ipOwner==='partner' ? 0 : 1);
    const youInv = ipNetCF*split + etfDiv*split + frankingCredits*split;
    const wifeInv = ipNetCF*(1-split) + etfDiv*(1-split) + frankingCredits*(1-split);

    const youTaxable = Math.max(0, grossSal + sideGross + extraIncGross + youInv - D.workDedYou);
    const wifeTaxable = Math.max(0, wifeGrossSal + wifeInv - D.workDedPartner);
    const youTax = calcTax(youTaxable, opts);
    const wifeTax = calcTax(wifeTaxable, opts);
    const youFrankRefund = frankingCredits * split;
    const wifeFrankRefund = frankingCredits * (1-split);
    const youNetTax = Math.max(0, youTax - youFrankRefund);
    const wifeNetTax = Math.max(0, wifeTax - wifeFrankRefund);

    const totalGross = grossSal + wifeGrossSal + sideGross + extraIncGross + ipNetCF + etfDiv;
    const totalNetIncome = totalGross - youNetTax - wifeNetTax;

    const sgcYou = grossSal * D.sgcRate;
    const sgcWife = wifeGrossSal * D.sgcRate;

    // Expenses (all CPI-inflated)
    const core = cpi(coreMonthly, yrs)*12;
    const prop = cpi(propMonthly, yrs)*12;
    const veh = age>=33 ? cpi(veh1Monthly+D.car2, yrs)*12 : cpi(veh1Monthly, yrs)*12;
    const ins = cpi(insMonthly, yrs)*12;
    const sav = cpi(savMonthly, yrs)*12;
    const child = childMonthly(age, yrs);
    const extraExp = extraExpMap[age] || 0;
    const mort = remainLoan>0 ? annualRepay : 0;
    const livingExpenses = core+prop+veh+ins+sav+child+extraExp;
    const grossSurplus = totalNetIncome - livingExpenses;
    const lec = lecMap[age] || 0;
    const preMortgageCash = grossSurplus - lec;
    const netCash = preMortgageCash - mort;

    let interestPaid = 0, principalPaid = 0;

    if(D.strategy===1) {
      if(remainLoan > 0) {
        const netDebt = Math.max(0, remainLoan - Math.max(0,offset));
        interestPaid = netDebt * D.mortgageRate;
        principalPaid = mort - interestPaid;
        remainLoan = Math.max(0, remainLoan - principalPaid);
        offset += netCash;
        if(offset > remainLoan) { etf += (offset - remainLoan); offset = remainLoan; }
      } else { etf += netCash; }
    } else if(D.strategy===2) {
      const half = netCash / 2;
      offset += half;
      etf = (etf + half) * (1+etfNet);
      const netDebt = Math.max(0, remainLoan - Math.max(0,offset));
      interestPaid = netDebt * D.mortgageRate;
      principalPaid = mort - interestPaid;
      remainLoan = Math.max(0, remainLoan - principalPaid);
      if(offset > remainLoan) { etf += (offset - remainLoan); offset = remainLoan; }
    } else {
      offset += netCash;
      const netDebt = Math.max(0, remainLoan - Math.max(0,offset));
      interestPaid = netDebt * D.mortgageRate;
      principalPaid = mort - interestPaid;
      remainLoan = Math.max(0, remainLoan - principalPaid);
      if(offset > remainLoan) { etf += (offset - remainLoan); offset = remainLoan; }
    }
    if(D.strategy !== 2) etf = etf * (1+etfNet);

    // Super: 15% contributions tax + pension-phase return post-60
    const netSGC = (sgcYou + sgcWife) * 0.85;
    const superRet = age >= D.preservationAge ? D.superReturnPension : D.superReturnAccum;
    superBal = (superBal + netSGC) * (1+superRet);

    pporVal *= (1+D.pporGrowth);
    if(D.strategy===3 && age >= D.ipPurchaseAge) {
      ipVal *= (1+D.ipGrowth);
      ipEquity = ipVal - ipLoan;
    }

    const nw = offset + etf + (age>=D.preservationAge ? superBal : 0) + ipEquity;
    const nwTotal = offset + etf + superBal + pporVal - remainLoan + ipEquity;
    const passiveIncome = Math.max(0,etf)*D.etfSWR
      + (age>=D.preservationAge ? superBal*D.superSWR : 0)
      + (D.strategy===3 ? Math.max(0, ipNetCF) : 0);

    rows.push({age,year,grossSal:grossSal+wifeGrossSal,netEach:totalNetIncome,
      totalIncome:totalNetIncome,core,prop,veh,ins,sav,child,extraExp,
      mort,interestPaid,principalPaid,ipNetCF,ipRent,ipInt,ipExpInfl,
      ipTopup: ipNetCF<0 ? -ipNetCF : 0,
      totalOut:livingExpenses,grossSurplus,lec,netCash,
      offset, remainLoan,etf,superBal,pporVal,ipVal,ipLoan,ipEquity,
      nw,nwTotal,passiveIncome,livingExpenses,preMortgageCash,
      youTax:youNetTax,wifeTax:wifeNetTax,etfDiv,frankingCredits});
  }
  return rows;
}

const LC = createContext(null);
function LifeProvider({children, startingCash}) {
  const { schedulePush, hydrated } = useSync();
  const [D,setD] = useState(() => {
    let saved = {};
    try { const s = localStorage.getItem('FinancePlan_D'); if(s) saved = JSON.parse(s); } catch(e){}
    return {...LIFE_DEFAULTS, ...saved, totalCash: startingCash ?? LIFE_DEFAULTS.totalCash};
  });

  useEffect(() => {
    if(!hydrated) return;
    try { const s = localStorage.getItem('FinancePlan_D'); if(s) {
      const saved = JSON.parse(s);
      setD({...LIFE_DEFAULTS, ...saved, totalCash: startingCash ?? LIFE_DEFAULTS.totalCash});
    }} catch(e){}
  }, [hydrated, startingCash]);

  useEffect(() => {
    setD(p => p.totalCash === startingCash ? p : {...p, totalCash:startingCash});
  }, [startingCash]);

  useEffect(() => {
    const toSave = {...D};
    delete toSave.totalCash;
    localStorage.setItem('FinancePlan_D', JSON.stringify(toSave));
    schedulePush();
  }, [D, schedulePush]);

  const update = useCallback((k,v) => setD(p => ({...p,[k]:v})), []);
  const rows = useMemo(() => computeLife(D), [D]);
  return React.createElement(LC.Provider, {value:{D,setD,update,rows}}, children);
}

function buildWarnings(rows, D) {
  const w = [];
  const negOffsetYrs = rows.filter(r => r.offset < 0).map(r => r.age);
  if(negOffsetYrs.length > 0) w.push('Offset goes negative at age '+negOffsetYrs[0]+(negOffsetYrs.length>1?' (and '+(negOffsetYrs.length-1)+' other years)':'')+'. Cashflow squeeze.');
  const negEtfYrs = rows.filter(r => r.etf < 0).map(r => r.age);
  if(negEtfYrs.length > 0) w.push('ETF goes negative at age '+negEtfYrs[0]+'. Model is drawing down assets it doesn\'t have.');
  const sgcYou = D.sal34 * D.sgcRate;
  const sgcWife = D.wifeSal34 * D.sgcRate;
  if(sgcYou > 30000 || sgcWife > 30000) w.push('Super SGC exceeds $30k concessional cap. Excess incurs additional tax.');
  let streak = 0, maxStreak = 0, startAge = 0;
  rows.forEach(r => {
    if(r.netCash < 0) { streak++; if(streak>maxStreak){ maxStreak=streak; startAge=r.age-streak+1; } }
    else streak = 0;
  });
  if(maxStreak >= 3) w.push(maxStreak+' consecutive years of overspend starting age '+startAge+'. Sustained deficit.');
  return w;
}

function WarnBanner({rows, D}) {
  const warnings = useMemo(()=>buildWarnings(rows, D), [rows, D]);
  if(warnings.length === 0) return null;
  return React.createElement('div', {className:'warn-banner'},
    React.createElement('h4', null, '⚠ Sanity Checks'),
    React.createElement('ul', null, ...warnings.map((w,i)=>React.createElement('li',{key:i},w)))
  );
}

// CASHFLOW TRACKER MODULE v3 — full reconciliation, no double-counting
// ═══════════════════════════════════════════════════════════════
// RECONCILIATION LOGIC (priority order):
//
// 1. StepPay loan settlements:
//    Card purchase (-$X SHOP on StepPay card)  → REAL EXPENSE (categorised by merchant)
//    StepPay Repayment (-$X from Everyday)     → INTERNAL TRANSFER (not counted)
//    STEPPAY PYMT credit (+$X on StepPay card) → INTERNAL TRANSFER (auto-hidden, not counted)
//    Repayment ↔ PYMT credit matched by amount + ≤14 days. If unmatched, repayment
//    remains as BNPL expense (fallback) so totals stay accurate.
//
// 2. Internal transfers between user's own accounts:
//    Matched by: same magnitude, opposite signs, different accounts, ≤5 days apart,
//    both already categorised as Transfers. Both legs excluded from totals.
//
// 3. Unmatched transfers appear as "External Inflow" / "External Outflow" — never
//    silently dropped, user can verify.
// ═══════════════════════════════════════════════════════════════

function autoCategory(desc) {
  const d = (desc || '').toUpperCase();
  for (const rule of AUTO_RULES) {
    if (rule.k.some(k => d.includes(k.toUpperCase().trim()))) return rule.cat;
  }
  return 'Other';
}

function hashTxn(date, amount, desc) {
  const s = date + '|' + amount + '|' + (desc || '').trim().slice(0, 40);
  let h = 5381;
  for (let i = 0; i < s.length; i++) { h = ((h << 5) + h) + s.charCodeAt(i); h = h & h; }
  return Math.abs(h).toString(36);
}

function uid() { return Math.random().toString(36).slice(2, 11); }

function splitCsvLine(line) {
  const parts = []; let inQ = false, cur = '';
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else { inQ = !inQ; } }
    else if (c === ',' && !inQ) { parts.push(cur); cur = ''; }
    else cur += c;
  }
  parts.push(cur);
  return parts;
}

function detectBank(text) {
  const first = (text.split(/\r?\n/)[0] || '').toLowerCase();
  if (first.includes('transaction date') && first.includes('debit') && first.includes('credit')) return 'macquarie';
  if (first.includes('date') && first.includes('description') && (first.includes('debit') || first.includes('credit'))) return 'westpac';
  if (/^\d{2}\/\d{2}\/\d{4}/.test(text.trim())) return 'commbank';
  return 'unknown';
}

const MONTHS = {JAN:'01',FEB:'02',MAR:'03',APR:'04',MAY:'05',JUN:'06',JUL:'07',AUG:'08',SEP:'09',OCT:'10',NOV:'11',DEC:'12'};

function parseDate(s) {
  s = (s || '').trim();
  let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  m = s.match(/^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})$/);
  if (m) { const mo = MONTHS[m[2].toUpperCase()]; if (mo) return m[3]+'-'+mo+'-'+m[1].padStart(2,'0'); }
  return null;
}

function parseCommBankCSV(text) {
  const rows = [];
  for (const line of text.split(/\r?\n/).filter(l => l.trim())) {
    const parts = splitCsvLine(line);
    if (parts.length < 3) continue;
    const date = parseDate(parts[0]);
    if (!date) continue;
    const amount = parseFloat(String(parts[1]).replace(/[^0-9.\-]/g, ''));
    if (isNaN(amount)) continue;
    rows.push({ date, amount, description:(parts[2]||'').trim(), balance:(parts[3]||'').trim() });
  }
  return rows;
}

function parseMacquarieCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const header = splitCsvLine(lines[0]).map(h => h.trim().toLowerCase());
  const col = name => header.indexOf(name);
  const iDate=col('transaction date'),iDetails=col('details'),iAcct=col('account'),
        iCat=col('category'),iSub=col('subcategory'),iDebit=col('debit'),iCredit=col('credit'),
        iBal=col('balance'),iOrig=col('original description');
  const rows = [];
  for (let li = 1; li < lines.length; li++) {
    const parts = splitCsvLine(lines[li]);
    const date = parseDate(parts[iDate]);
    if (!date) continue;
    const debit = parseFloat(String(parts[iDebit]||'').replace(/[^0-9.]/g,''))||0;
    const credit = parseFloat(String(parts[iCredit]||'').replace(/[^0-9.]/g,''))||0;
    const amount = credit - debit;
    if (amount === 0 && !debit && !credit) continue;
    const details=(parts[iDetails]||'').trim(); const origDesc=(parts[iOrig]||'').trim();
    const description = details||origDesc;
    const acct=(parts[iAcct]||'').trim()||'Macquarie';
    const mqCat=(parts[iCat]||'').trim().toLowerCase(); const mqSub=(parts[iSub]||'').trim().toLowerCase();
    let preCat = null;
    if (mqSub === 'transfers' || mqCat === 'financial') preCat = 'Transfers';
    else if (mqCat === 'income') preCat = 'Income';
    rows.push({ date, amount, description, balance:(parts[iBal]||'').trim(), account:acct, preCat });
  }
  return rows;
}

// Account detection — recognises StepPay card
function detectAccount(rows, bank) {
  if (bank === 'macquarie') {
    const counts = {};
    rows.forEach(r => { if (r.account) counts[r.account] = (counts[r.account]||0)+1; });
    const top = Object.entries(counts).sort((a,b) => b[1]-a[1])[0];
    return top ? top[0] : 'Macquarie';
  }
  const joined = rows.map(r => r.description || '').join('\n').toUpperCase();
  if (joined.includes('DEFT PAYMENT')) return 'Rent Account';
  if (joined.includes('LUXOTTICA') || joined.includes('ESSILOR')) return 'Salary Account';
  const emptyBal = rows.filter(r => !r.balance || r.balance.trim() === '').length;
  const hasSteppayPymt = joined.includes('STEPPAY PYMT');
  if (emptyBal > rows.length * 0.7 && hasSteppayPymt) return 'StepPay';
  if (emptyBal > rows.length * 0.7) return 'Credit Card';
  return 'Everyday Account';
}

function isAutoHide(desc) { return (desc || '').toUpperCase().includes('STEPPAY PYMT'); }

function catKind(cat) { return (CATS[cat] || {}).kind || 'expense'; }
function isReconciled(t, rec) { return rec && rec.has(t.id); }

function effectiveKind(t, rec) {
  if (isReconciled(t, rec)) return 'transfer';
  return catKind(t.category);
}

function isExpenseTxn(t, rec) { return !t.hidden && t.amount < 0 && effectiveKind(t, rec) === 'expense'; }
function isIncomeTxn(t, rec)  { return !t.hidden && t.amount > 0 && effectiveKind(t, rec) === 'income'; }

// ── Reconciliation engine ──────────────────────────────────────
function reconcileAll(allTxns) {
  const rec = new Map();

  // Stage A: StepPay PYMT credits ↔ StepPay Repayments (description-based, hardest)
  const pymts = allTxns.filter(t => t.amount > 0 && (t.description||'').toUpperCase().includes('STEPPAY PYMT'));
  const reps = allTxns.filter(t => t.amount < 0 && (t.description||'').includes('StepPay Repayment'));
  const usedP = new Set();
  const repsSorted = [...reps].sort((a,b) => a.date.localeCompare(b.date));
  for (const rep of repsSorted) {
    let best = null, bestDelta = Infinity;
    const dRep = new Date(rep.date).getTime();
    for (const p of pymts) {
      if (usedP.has(p.id)) continue;
      if (p.account === rep.account) continue;
      if (Math.abs(p.amount - Math.abs(rep.amount)) > 0.01) continue;
      const delta = Math.abs((new Date(p.date).getTime() - dRep) / 86400000);
      if (delta > 14) continue;
      if (delta < bestDelta) { best = p; bestDelta = delta; }
    }
    if (best) {
      rec.set(rep.id, { linkedTo:best.id, type:'steppay', delta:bestDelta });
      rec.set(best.id, { linkedTo:rep.id, type:'steppay', delta:bestDelta });
      usedP.add(best.id);
    }
  }

  // Stage B: Generic internal transfers (both legs categorised as Transfers)
  const transfers = allTxns.filter(t => !rec.has(t.id) && t.category === 'Transfers');
  transfers.sort((a,b) => a.date.localeCompare(b.date));
  const usedT = new Set();
  for (const a of transfers) {
    if (usedT.has(a.id)) continue;
    let best = null, bestDelta = Infinity;
    const dA = new Date(a.date).getTime();
    for (const b of transfers) {
      if (a.id === b.id || usedT.has(b.id)) continue;
      if (a.account === b.account) continue;
      if (Math.abs(a.amount + b.amount) > 0.01) continue;
      const delta = Math.abs((new Date(b.date).getTime() - dA) / 86400000);
      if (delta > 5) continue;
      if (delta < bestDelta) { best = b; bestDelta = delta; }
    }
    if (best) {
      rec.set(a.id, { linkedTo:best.id, type:'transfer', delta:bestDelta });
      rec.set(best.id, { linkedTo:a.id, type:'transfer', delta:bestDelta });
      usedT.add(a.id); usedT.add(best.id);
    }
  }

  return rec;
}

// ═══════════════════════════════════════════════════════════════
// Transaction Context
// ═══════════════════════════════════════════════════════════════
const TxnCtx = createContext(null);

function TxnProvider({ children }) {
  const { schedulePush, hydrated } = useSync();
  const [T, setT] = useState(() => {
    try { const s = localStorage.getItem('FinancePlan_T'); if (s) return JSON.parse(s); } catch (e) {}
    return { transactions: [], budgets: {} };
  });

  useEffect(() => {
    if (!hydrated) return;
    try { const s = localStorage.getItem('FinancePlan_T'); if (s) setT(JSON.parse(s)); } catch (e) {}
  }, [hydrated]);

  useEffect(() => {
    localStorage.setItem('FinancePlan_T', JSON.stringify(T));
    schedulePush();
  }, [T, schedulePush]);

  const rec = useMemo(() => reconcileAll(T.transactions || []), [T.transactions]);

  const importTransactions = useCallback(newTxns => {
    setT(prev => {
      const ids = new Set((prev.transactions||[]).map(t => t.id));
      const added = newTxns.filter(t => !ids.has(t.id));
      return { ...prev, transactions: [...(prev.transactions||[]), ...added] };
    });
  }, []);
  const addManual = useCallback(txn => {
    setT(prev => ({ ...prev, transactions: [...(prev.transactions||[]), { ...txn, id:'m_'+uid(), manual:true }] }));
  }, []);
  const updateCategory = useCallback((id, cat) => {
    setT(prev => ({ ...prev, transactions: (prev.transactions||[]).map(t => t.id===id?{...t,category:cat,manual:true}:t) }));
  }, []);
  const bulkUpdateCategory = useCallback((ids, cat) => {
    const s = new Set(ids);
    setT(prev => ({ ...prev, transactions: (prev.transactions||[]).map(t => s.has(t.id)?{...t,category:cat,manual:true}:t) }));
  }, []);
  const bulkSetHidden = useCallback((ids, hidden) => {
    const s = new Set(ids);
    setT(prev => ({ ...prev, transactions: (prev.transactions||[]).map(t => s.has(t.id)?{...t,hidden}:t) }));
  }, []);
  const bulkDelete = useCallback(ids => {
    const s = new Set(ids);
    setT(prev => ({ ...prev, transactions: (prev.transactions||[]).filter(t => !s.has(t.id)) }));
  }, []);
  const toggleHidden = useCallback(id => {
    setT(prev => ({ ...prev, transactions: (prev.transactions||[]).map(t => t.id===id?{...t,hidden:!t.hidden}:t) }));
  }, []);
  const updateBudget = useCallback((cat, amt) => {
    setT(prev => ({ ...prev, budgets: { ...prev.budgets, [cat]:amt } }));
  }, []);
  const deleteMonth = useCallback(ym => {
    setT(prev => ({ ...prev, transactions: (prev.transactions||[]).filter(t => t.date.slice(0,7)!==ym) }));
  }, []);
  const clearAll = useCallback(() => setT({ transactions:[], budgets:{} }), []);

  return React.createElement(TxnCtx.Provider, {
    value: { T, rec, importTransactions, addManual, updateCategory, bulkUpdateCategory, bulkSetHidden, bulkDelete, toggleHidden, updateBudget, deleteMonth, clearAll }
  }, children);
}

const useTxn = () => useContext(TxnCtx);

function UploadZone({ onDone }) {
  const { T, importTransactions } = useTxn();
  const [drag, setDrag] = useState(false);
  const [previews, setPreviews] = useState([]);
  const inputRef = useRef(null);

  async function processFiles(flist) {
    const results = [];
    for (const file of [...flist]) {
      if (!file.name.toLowerCase().endsWith('.csv')) continue;
      const text = await file.text();
      const bank = detectBank(text);
      let raw, acctFromFile=null;
      if (bank === 'macquarie') { raw = parseMacquarieCSV(text); acctFromFile = detectAccount(raw,'macquarie'); }
      else { raw = parseCommBankCSV(text); acctFromFile = detectAccount(raw, bank==='commbank'?'commbank':'unknown'); }
      if (!raw.length) { results.push({fname:file.name,bank,error:'No valid rows found',txns:[],total:0,dupes:0,fresh:0,account:'-'}); continue; }
      const txns = raw.map(r => ({
        id: hashTxn(r.date, r.amount, r.description),
        date: r.date,
        amount: r.amount,
        description: r.description,
        account: r.account || acctFromFile,
        category: r.preCat || autoCategory(r.description),
        hidden: isAutoHide(r.description),
        manual: false,
        bank,
      }));
      const existIds = new Set((T.transactions||[]).map(t => t.id));
      const dupes = txns.filter(t => existIds.has(t.id)).length;
      results.push({ fname:file.name, bank, txns, account:acctFromFile, total:txns.length, dupes, fresh:txns.length-dupes });
    }
    if (results.length) setPreviews(p => [...p, ...results]);
  }
  function renameAcct(i, name) {
    setPreviews(p => p.map((f,j) => j!==i?f:{...f, account:name, txns:f.txns.map(t=>({...t,account:name}))}));
  }
  function removePrev(i) { setPreviews(p => p.filter((_,j) => j!==i)); }

      onClick:()=>inputRef.current&&inputRef.current.click(),
      style:{border:'2px dashed '+(drag?'var(--gold)':'var(--border2)'),borderRadius:'var(--radius)',padding:'2rem 1.5rem',textAlign:'center',cursor:'pointer',transition:'all .2s',background:drag?'rgba(212,175,55,.07)':'var(--bg2)',marginBottom:previews.length?'1rem':'0'}
    },
      React.createElement('input', {ref:inputRef,type:'file',accept:'.csv',multiple:true,style:{display:'none'},onChange:e=>processFiles(e.target.files)}),
      React.createElement('div', {style:{fontSize:'2rem',marginBottom:'.4rem'}}, drag?'📥':'📂'),
      React.createElement('div', {style:{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:'var(--t-md)',color:drag?'var(--gold)':'var(--text)',marginBottom:'.25rem'}},
        drag?'Release to upload':'Drag & drop CSVs here'),
      React.createElement('div', {style:{fontSize:'var(--t-xs)',color:'var(--text3)'}}, 'CommBank · Macquarie · multi-file supported  ·  Click to browse')
    ),
    previews.length > 0 && React.createElement('div', null,
      React.createElement('div', {style:{display:'flex',flexDirection:'column',gap:'.5rem',marginBottom:'1rem'}},
        ...previews.map((f,i) => React.createElement('div', {key:i,style:{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--radius)',overflow:'hidden'}},
          React.createElement('div', {style:{padding:'.7rem 1rem',display:'flex',gap:'.75rem',alignItems:'center',flexWrap:'wrap',background:'var(--surface2)'}},
            React.createElement('div', {style:{flex:1,minWidth:'120px'}},
              React.createElement('div', {style:{fontSize:'var(--t-xs)',color:'var(--text3)',marginBottom:'.15rem',wordBreak:'break-all'}}, f.fname),
              React.createElement('div', {style:{display:'flex',gap:'.4rem',flexWrap:'wrap',alignItems:'center'}},
                React.createElement('span', {style:{fontSize:'var(--t-xs)',padding:'.1rem .4rem',borderRadius:'.5rem',background:'rgba(74,158,255,.12)',color:'var(--blue)'}}, bankLabel[f.bank]||'CSV'),
                React.createElement('span', {style:{fontSize:'var(--t-sm)',fontWeight:600,color:'var(--text)'}}, f.total+' rows'),
                f.dupes > 0 && React.createElement('span', {style:{fontSize:'var(--t-xs)',color:'var(--gold)',background:'rgba(212,175,55,.1)',padding:'.1rem .4rem',borderRadius:'.5rem'}}, f.dupes+' dupes'),

          ),

            })
          )
        ))

      React.createElement('button', {className:'btn-primary',onClick:doImport,style:{width:'100%',opacity:totalFresh===0?.5:1,cursor:totalFresh===0?'not-allowed':'pointer'}},

    )
  );
}

// ═══════════════════════════════════════════════════════════════
// Summary Cards
// ═══════════════════════════════════════════════════════════════
function CfSummaryCards({ txns, rec }) {
  let income=0, expenses=0, internalCount=0, externalIn=0, externalOut=0, steppayPairs=0;
  for (const t of txns) {
    if (t.hidden) continue;
    if (isReconciled(t, rec)) {
      internalCount++;
      const info = rec.get(t.id);
      if (info && info.type === 'steppay') steppayPairs++;
      continue;
    }
    const k = catKind(t.category);
    if (k === 'income' && t.amount > 0) income += t.amount;
    else if (k === 'expense' && t.amount < 0) expenses += Math.abs(t.amount);
    else if (k === 'transfer') {
      if (t.amount > 0) externalIn += t.amount;
      else externalOut += Math.abs(t.amount);
    }
  }
  internalCount = Math.floor(internalCount / 2);
  steppayPairs = Math.floor(steppayPairs / 2);
  const transferPairs = internalCount - steppayPairs;
  const net = income - expenses;
  const savRate = income > 0 ? net/income*100 : 0;
  return React.createElement('div', {className:'stat-grid',style:{marginBottom:'1.5rem'}},
    React.createElement('div', {className:'stat-card highlight'},
      React.createElement('div', {className:'stat-label'}, 'Total Income'),
      React.createElement('div', {className:'stat-value'}, fmt(income)),
      React.createElement('div', {className:'stat-sub'}, 'Salary & wages')
    ),
    React.createElement('div', {className:'stat-card'},
      React.createElement('div', {className:'stat-label'}, 'Total Expenses'),
      React.createElement('div', {className:'stat-value',style:{color:'var(--red)'}}, fmt(expenses)),
      React.createElement('div', {className:'stat-sub'}, 'Net of reconciliation')
    ),

// ── 1. Waterfall: Where did the money go? ──────────────────────
function WaterfallChart({ txns, rec }) {
  const income = txns.filter(t => isIncomeTxn(t, rec)).reduce((s,t)=>s+t.amount, 0);
  const catAmt = {};
  txns.filter(t => isExpenseTxn(t, rec)).forEach(t => { catAmt[t.category] = (catAmt[t.category]||0) + Math.abs(t.amount); });
  // Order: fixed essentials first, then variable
  const order = ['Rent/Housing','Utilities','Insurance','Education','Healthcare','Tech','Groceries','Transport/Fuel','BNPL/StepPay','Eating Out','Shopping','Entertainment','Other'];
  const orderedCats = order.filter(c => catAmt[c] > 0).concat(Object.keys(catAmt).filter(c => !order.includes(c) && catAmt[c] > 0));

  if (income === 0 && orderedCats.length === 0) return null;

  let running = 0;
  const data = [{name:'Income', base:0, value:income, kind:'income', color:'#22c55e'}];
  running = income;
  for (const cat of orderedCats) {
    const v = catAmt[cat];
    running -= v;
    data.push({name:cat, base:Math.max(0, running), value:v, kind:'expense', color:CATS[cat]?CATS[cat].color:'#94a3b8'});
  }
  const net = running;

}

// ── 3. Recurring Subscription Detector ─────────────────────────
function normaliseMerchant(desc) {
  return desc.toUpperCase()
    .replace(/CARD XX\d+.*$/i, '')
    .replace(/VALUE DATE:.*$/i, '')
    .replace(/RECEIPT NUMBER:.*$/i, '')
    .replace(/\s+(NSW|VIC|AUS|QLD|WA|SA|TAS|ACT|NT)\b.*$/i, '')
    .replace(/\s+\d{4,}/g, '')         // strip long numbers
    .replace(/\s{2,}/g, ' ')
    .trim()
    .slice(0, 35);
}

function detectRecurring(allTxns) {
  const groups = {};
  allTxns.filter(t => !t.hidden && t.amount < 0 && t.category !== 'Transfers').forEach(t => {
    const key = normaliseMerchant(t.description);
    if (!key || key.length < 3) return;
    if (!groups[key]) groups[key] = [];
    groups[key].push(t);
  });
  const recurring = [];
  for (const [merchant, txns] of Object.entries(groups)) {
    if (txns.length < 2) continue;
    const months = new Set(txns.map(t => t.date.slice(0,7)));
    if (months.size < 2) continue;
    const amts = txns.map(t => Math.abs(t.amount));
    const avg = amts.reduce((s,a)=>s+a,0) / amts.length;
    if (avg < 2) continue;  // ignore tiny noise
    const inRange = amts.filter(a => Math.abs(a-avg) < Math.max(2, avg*0.15)).length;
    if (inRange < amts.length * 0.7) continue;  // 70% must be consistent
    const perMonth = txns.length / months.size;
    const freqLabel = perMonth >= 3.5 ? 'weekly' : perMonth >= 1.7 ? 'fortnightly' : perMonth >= 0.85 ? 'monthly' : perMonth >= 0.3 ? 'quarterly' : 'irregular';
    const annual = avg * (freqLabel==='weekly'?52 : freqLabel==='fortnightly'?26 : freqLabel==='monthly'?12 : freqLabel==='quarterly'?4 : 12*perMonth/(months.size||1));
    const lastSeen = txns.sort((a,b)=>b.date.localeCompare(a.date))[0].date;
    const cat = txns[0].category;
    recurring.push({ merchant, freqLabel, occurrences:txns.length, monthsSeen:months.size, avgAmount:avg, annualEstimate:annual, lastSeen, category:cat });
  }
  return recurring.sort((a,b) => b.annualEstimate - a.annualEstimate);
}

  const recurring = useMemo(() => detectRecurring(allTxns), [allTxns]);

      )
    ),
    React.createElement('div', {className:'table-wrap'},
      React.createElement('table', {className:'data-table'},
        React.createElement('thead', null, React.createElement('tr', null,

function BNPLExposure({ allTxns, rec }) {
  // For each month, sum StepPay Repayments + Afterpay outflows
  const monthly = {};
  allTxns.filter(t => !t.hidden && t.amount < 0).forEach(t => {
    const d = (t.description||'').toUpperCase();
    let kind = null;
    if (d.includes('STEPPAY REPAYMENT')) kind = 'StepPay';
    else if (d.includes('AFTERPAY')) kind = 'Afterpay';
    else if (d.includes('ZIP PAY') || d.includes('HUMM ') || d.includes('KLARNA')) kind = 'Other BNPL';
    if (!kind) return;
    const ym = t.date.slice(0,7);
    if (!monthly[ym]) monthly[ym] = {StepPay:0, Afterpay:0, 'Other BNPL':0};
    monthly[ym][kind] += Math.abs(t.amount);
  });
  const months = Object.keys(monthly).sort();
  if (!months.length) {
    return React.createElement('div', {className:'chart-card'},
      React.createElement('div', {className:'chart-title'}, '📱 BNPL Exposure'),

        'No BNPL repayments detected — good!')

  const monthlyIncome = {};
  allTxns.filter(t => !t.hidden && isIncomeTxn(t, rec)).forEach(t => {
    const ym = t.date.slice(0,7);
    monthlyIncome[ym] = (monthlyIncome[ym]||0) + t.amount;
  });
  const data = months.map(ym => {
    const total = monthly[ym].StepPay + monthly[ym].Afterpay + monthly[ym]['Other BNPL'];
    const inc = monthlyIncome[ym] || 0;
    return {
      month: new Date(ym+'-01').toLocaleDateString('en-AU',{month:'short',year:'2-digit'}),
      StepPay: Math.round(monthly[ym].StepPay),
      Afterpay: Math.round(monthly[ym].Afterpay),
      'Other BNPL': Math.round(monthly[ym]['Other BNPL']),
      pctOfIncome: inc > 0 ? (total/inc*100) : 0

  });
  const lastMonth = data[data.length-1];

      ),

        React.createElement('div', {style:{fontSize:'var(--t-xs)',color:'var(--text3)'}}, 'Last month'),
        React.createElement('div', {style:{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:'1.4rem',color:'#f87171'}}, fmt(totalLast)),
        React.createElement('div', {style:{fontSize:'var(--t-xs)',color:lastMonth.pctOfIncome > 15 ? 'var(--red)' : 'var(--text3)'}}, lastMonth.pctOfIncome.toFixed(1) + '% of income')
      )
    ),
    React.createElement(ResponsiveContainer, {width:'100%',height:230},
      React.createElement(BarChart, {data,margin:{top:8,right:16,bottom:0,left:8}},
        React.createElement(CartesianGrid, {strokeDasharray:'3 3',stroke:'var(--border)'}),
        React.createElement(XAxis, {dataKey:'month',tick:{fill:'#fff',fontSize:11}}),
        React.createElement(YAxis, {tickFormatter:v=>'$'+v,tick:{fill:'#fff',fontSize:11},axisLine:false,tickLine:false}),
        React.createElement(Tooltip, {contentStyle:{background:'var(--surface2)',border:'1px solid var(--border2)',borderRadius:'var(--radius-sm)',fontSize:'var(--t-xs)',color:'#fff'},itemStyle:{color:'#fff'},labelStyle:{color:'#fff'}}),
        React.createElement(Legend, {wrapperStyle:{fontSize:'var(--t-xs)',color:'#fff'}}),
        React.createElement(Bar, {dataKey:'StepPay',stackId:'a',fill:'#f87171'}),

        React.createElement(Bar, {dataKey:'Other BNPL',stackId:'a',fill:'#facc15'})
      )
    ),
    React.createElement('div', {style:{padding:'.75rem 1rem',background:'var(--bg2)',borderLeft:'3px solid '+(avgPct>15?'var(--red)':avgPct>8?'var(--gold)':'var(--green)'),borderRadius:'var(--radius-sm)',marginTop:'.75rem'}},
      React.createElement('div', {style:{fontSize:'var(--t-sm)',fontWeight:700,marginBottom:'.25rem',color:avgPct>15?'var(--red)':avgPct>8?'var(--gold)':'var(--green)'}},
