<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

--border:#2a3448;--border2:#3a4560;--gold:#d4a843;--gold-dim:#a07c2a;--gold-glow:rgba(212,168,67,.15);

.nav-btn{font-family:'Syne',sans-serif;font-size:var(--t-sm);font-weight:600;padding:.4rem 1.2rem;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;color:var(--text2);cursor:pointer;transition:all .2s;letter-spacing:.04em}

.table-wrap{overflow-x:auto;border-radius:var(--radius)}

.data-table th{font-family:'Syne',sans-serif;font-size:var(--t-xs);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;padding:.55rem .8rem;background:var(--surface2);border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}

.data-table td{padding:.4rem .8rem;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;color:var(--text2)}

.pos{color:var(--green)}.neg{color:var(--red)}.gold-t{color:var(--gold);font-weight:600}
.dyn-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:.75rem;padding:.75rem;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:.5rem;align-items:end}
.btn-add{background:transparent;border:1px dashed var(--border2);color:var(--text2);border-radius:var(--radius-sm);padding:.5rem 1rem;font-size:var(--t-sm);cursor:pointer;width:100%;margin-top:.5rem;font-family:'DM Sans',sans-serif}

.btn-remove:hover{background:var(--red);color:#fff}
.btn-fetch{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:.5rem 1rem;font-size:var(--t-sm);cursor:pointer;font-family:'DM Sans',sans-serif}

select.input-field{appearance:auto}
#login-screen{display:flex;min-height:100vh;align-items:center;justify-content:center;background:var(--bg)}
#app-screen{display:none}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;width:min(360px,92vw);box-shadow:0 8px 40px rgba(0,0,0,.5)}
.login-logo{text-align:center;margin-bottom:1.75rem}
.login-logo .logo-icon{font-size:2.5rem;color:var(--gold)}
.login-logo h1{font-family:'Syne',sans-serif;font-size:var(--t-xl);font-weight:800;color:var(--text);margin:.25rem 0 0}
.login-logo p{font-size:var(--t-xs);color:var(--text3);margin-top:.2rem}
.login-form{display:flex;flex-direction:column;gap:.9rem}
.login-label{display:block;font-size:var(--t-xs);font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem}
.login-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:var(--t-base);padding:.55rem .75rem}
.login-input:focus{outline:none;border-color:var(--gold-dim)}
.pw-wrap{position:relative}
.pw-wrap .login-input{padding-right:2.8rem}
.pw-toggle{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:1rem;line-height:1;padding:.25rem}
.login-err{color:var(--red);font-size:var(--t-xs);text-align:center;min-height:1.2em}
.login-btn{background:var(--gold);color:#0b0e14;border:none;border-radius:var(--radius-sm);padding:.8rem;font-family:'Syne',sans-serif;font-weight:700;font-size:var(--t-md);cursor:pointer;letter-spacing:.04em;width:100%;margin-top:.25rem}
.login-btn:hover{background:#e8bc55}
</style>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">&#8371;</div>
      <h1>FinancePlan</h1>
      <p>Family &amp; Life Wealth Planner</p>
    </div>
    <div class="login-form">
      <div>
        <label class="login-label" for="inp-user">Username</label>
        <input class="login-input" id="inp-user" type="text" placeholder="ujjan" autocomplete="username"/>
      </div>
      <div>
        <label class="login-label" for="inp-pass">Password</label>
        <div class="pw-wrap">
          <input class="login-input" id="inp-pass" type="password" placeholder="password" autocomplete="current-password"/>

<div id="app-screen"><div id="root"></div></div>
<script>
var _pwVisible=false;
function togglePw(){var i=document.getElementById('inp-pass'),b=document.getElementById('pw-btn');_pwVisible=!_pwVisible;i.type=_pwVisible?'text':'password';b.textContent=_pwVisible?'Hide':'Show';}
function doLogin(){
  var u=document.getElementById('inp-user').value.trim(),p=document.getElementById('inp-pass').value,err=document.getElementById('login-err');
  err.textContent='';
  if(u==='ujjan'&&p==='AbCd@1949'){
    localStorage.setItem('FP_Logged_In','true');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app-screen').style.display='block';
    if(!window._appMounted)initApp();
  }else{
    err.textContent='Invalid username or password';
  }
}
document.addEventListener('DOMContentLoaded',function(){
  if(localStorage.getItem('FP_Logged_In')==='true'){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app-screen').style.display='block';
    if(!window._appMounted)initApp();
  }
  document.getElementById('inp-pass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  document.getElementById('inp-user').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('inp-pass').focus();});
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script>

const {useState,useMemo,useEffect,useContext,createContext,useCallback}=React;
const {LineChart,Line,BarChart,Bar,XAxis,YAxis,CartesianGrid,Tooltip,Legend,
       ResponsiveContainer,ReferenceLine,Cell,AreaChart,Area}=Recharts;

// ── Shared Config ─────────────────────────────────────────────────────────
const DEFAULTS={
  dates:{yourSalRise:202607,wifeP2:202607,wifeP3:202707,extraEnd:202611,expDrop:202707,
    childcareStart:202707,ccsStart:202711,lodge485:202707,agentPay:202708,carMonth:202706,
    prGrant:202711,tuit1:202607,tuit2:202701,tax1:202607,tax2:202707,tax3:202807},
  income:{yourSalLow:800,yourSalHigh:1323,wifeP1:736,wifeP2:944,wifeP3:1500,extraYou:630,freelance:100},
  savings:{acctA:5500,acctB:11500,macRate:0.045},
  expenses:{expWk:1300,expWkPost:950,carCost:10000,carRun:175},
  childcare:{dailyRate:180,discount:0.30,ccsRate:0.72,days:5},
  tax:{taxFree:18200,r1:0.19,r2:0.325,r3:0.37,lmito:1500,medicare:0.02},
  nepal:{noInt:40,fixed12:20,mktYou:30,mktWife:10,nrsRate:0.04,exchange:95,exchangeAuto:false,exchangeLoading:false},
  oneoff:{tuit1:9500,tuit2:9500,v485pri:4770,v485sec:2385,v485adm:500,oshc:1200,
    skills:600,english:400,police:200,medicals:600,agent:3000,skills2:300,prPri:4640,prSec:2330,stateNom:300},
  extraIncomes:[], extraExpenses:[], extraOneoffs:[]
};

// ── Context Provider ──────────────────────────────────────────────────────
const FC=createContext(null);
function FinanceProvider({children}){
  const [A,setA]=useState(()=>{ try{const s=localStorage.getItem('FP_A');if(s)return JSON.parse(s);}catch(e){} return DEFAULTS; });
  useEffect(()=>{localStorage.setItem('FP_A',JSON.stringify(A));},[A]);
  const update=useCallback((sec,key,val)=>setA(p=>({...p,[sec]:{...p[sec],[key]:val}})),[]);
  return React.createElement(FC.Provider,{value:{A,setA,update}},children);
}
const useFinance=()=>useContext(FC);

// ── Projection Section ────────────────────────────────────────────────────
function Proj2028(){
  const {A,update}=useFinance();
  const {dates,income,savings,expenses,childcare,tax,oneoff,extraIncomes,extraExpenses,extraOneoffs}=A;
  const [tab,setTab]=useState(()=>localStorage.getItem('FP_P_Tab') || 'assumptions');
  useEffect(()=>localStorage.setItem('FP_P_Tab', tab), [tab]);

  const rows = useMemo(()=>{
    const WPM=365.25/12/7;
    const ccNopr=childcare.dailyRate*(1-childcare.discount);
    const ccPr=childcare.dailyRate*(1-childcare.discount)*(1-childcare.ccsRate);
    const oo={}; const add=(ym,v)=>{oo[ym]=(oo[ym]||0)+v};
    add(dates.tuit1,oneoff.tuit1*1.1); add(dates.tuit2,oneoff.tuit2*1.1);
    const v485=oneoff.v485pri+oneoff.v485sec+oneoff.v485adm+oneoff.oshc+oneoff.skills+oneoff.english+oneoff.police+oneoff.medicals;
    add(dates.lodge485,v485*1.1); add(dates.agentPay,(oneoff.agent+oneoff.skills2)*1.1);
    add(dates.carMonth,expenses.carCost*1.1); add(dates.prGrant,(oneoff.prPri+oneoff.prSec+oneoff.stateNom)*1.1);
    (extraOneoffs||[]).forEach(x=>{if(x.ym&&x.amount)add(x.ym,x.amount*(1+(x.buffer||10)/100));});
    function taxCalc(inc){ const {taxFree,r1,r2,r3,lmito,medicare}=tax; let t=0; if(inc<=taxFree)t=0; else if(inc<=45000)t=(inc-taxFree)*r1; else if(inc<=120000)t=5092+(inc-45000)*r2; else t=29467+(inc-120000)*r3; return Math.max(0,t+inc*medicare-lmito); }
    const ref=(y,w)=>Math.max(0,taxCalc(y)*0.05+tax.lmito)+Math.max(0,taxCalc(w)*0.05+tax.lmito);
    const taxMap={}; taxMap[dates.tax1]=ref(income.yourSalLow*52+income.extraYou*26,income.wifeP1*52); taxMap[dates.tax2]=ref(income.yourSalLow*4+income.yourSalHigh*48,income.wifeP2*52+income.freelance*52); taxMap[dates.tax3]=ref(income.yourSalHigh*52,income.wifeP2*4+income.wifeP3*48);
    const rows=[];let balA=savings.acctA,balB=savings.acctB;let y=2026,m=6;
    const ML=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    while(y*100+m<=202807){
      const ym=y*100+m; const yourSal=(ym<dates.yourSalRise?income.yourSalLow:income.yourSalHigh)*WPM; const wifeSal=(ym<dates.wifeP2?income.wifeP1:ym<dates.wifeP3?income.wifeP2:income.wifeP3)*WPM; const extra=ym<=dates.extraEnd?income.extraYou*WPM:0; const freelance=income.freelance*WPM; const extraInc=(extraIncomes||[]).filter(r=>r.fromYm&&r.toYm&&ym>=r.fromYm&&ym<=r.toYm).reduce((s,r)=>s+(r.weekly?r.amount*WPM:r.amount),0); const intA=Math.max(0,balA)*savings.macRate/12; const intB=Math.max(0,balB)*savings.macRate/12; const taxRet=taxMap[ym]||0; const totalInc=yourSal+wifeSal+extra+freelance+extraInc+intA+intB+taxRet; const living=(ym<dates.expDrop?expenses.expWk:expenses.expWkPost)*WPM; const carRun=ym>=dates.carMonth?expenses.carRun*WPM:0; const cc=ym<dates.childcareStart?0:ym<dates.ccsStart?ccNopr*childcare.days*WPM:ccPr*childcare.days*WPM; const extraExp=(extraExpenses||[]).filter(r=>r.fromYm&&r.toYm&&ym>=r.fromYm&&ym<=r.toYm).reduce((s,r)=>s+(r.weekly?r.amount*WPM:r.amount),0); const ooThis=oo[ym]||0; const totalExp=living+carRun+cc+extraExp+ooThis; const net=totalInc-totalExp; balB+=net; rows.push({label:ML[m-1]+'-'+String(y).slice(2),balA,balB,total:balA+balB}); m++; if(m>12){m=1;y++;}
    }
    return rows;
  },[A]);

  return React.createElement('div',null,
    React.createElement('nav',{className:'subnav'},
      React.createElement('button',{className:'subnav-btn'+(tab==='assumptions'?' active':''),onClick:()=>setTab('assumptions')},'⚙️ Assumptions'),
      React.createElement('button',{className:'subnav-btn'+(tab==='results'?' active':''),onClick:()=>setTab('results')},'📊 Results')
    ),
    tab==='assumptions' ? React.createElement(Assumptions,null) : React.createElement(Results,{rows})
  );
}

function Assumptions(){ /* ... (Placeholder for existing content) ... */ return React.createElement('p',null,'(Assumption UI content goes here)'); }
function Results({rows}){ /* ... (Placeholder for existing content) ... */ return React.createElement('p',null,'(Results UI content goes here)'); }

// ── Life Planner ──────────────────────────────────────────────────────────
const LIFE_DEFAULTS = {
  strategy: 1, startAge: 31, totalCash: 250000, pporPrice: 750000, depositPct: 0.20, legal: 2000, mortgageRate: 0.06, mortgageTerm: 30, pporGrowth: 0.045, sal31: 90000, sal32: 100000, sal33: 110000, sal34: 120000, salGrowth: 0.03, wifeSal31: 90000, wifeSal32: 100000, wifeSal33: 110000, wifeSal34: 120000, wifeSalGrowth: 0.03, sideIncome: 500, sgcRate: 0.12, groceries: 1200, utilities: 280, phone: 200, streaming: 50, clothing: 100, eatOut: 500, gifts: 100, council: 220, water: 80, buildingIns: 150, maintenance: 100, strata: 0, garden: 83, otherHouse: 150, carFuel: 300, carIns: 140, carRego: 85, carService: 150, carReplace: 500, car2: 550, healthIns: 380, lifeIns: 0, incomeProtect: 0, trauma: 0, travel: 800, healthcare: 200, christmas: 150, childcare: 1200, primary: 400, highSchool: 700, kidsActivities: 400, uzielETF: 250, uzielBirthYear: 2023, superYou: 18000, superPartner: 12000, superReturn: 0.07, preservationAge: 60, superSWR: 0.035, etfGross: 0.09, etfFees: 0.002, etfTaxDrag: 0.015, etfSWR: 0.035, cpiRate: 0.03, ipPurchaseAge: 37, ipPrice: 650000, ipDepositPct: 0.20, ipLegal: 2500, ipLoanRate: 0.063, ipGrowth: 0.04, ipGrossYield: 0.035, ipExpenses: 8500, lifeEvents: [], extraIncome: [], extraExpense: []
};

function computeLife(D) {
  const rows = [];
  const stamp = vicStampDuty(D.pporPrice);
  const deposit = D.pporPrice * D.depositPct;
  const loan = D.pporPrice - deposit;
  const totalCosts = deposit + stamp + D.legal;
  const startOffset = D.totalCash - totalCosts;
  const annualRepay = pmt(D.mortgageRate/12, D.mortgageTerm*12, loan)*12;
  const etfNet = D.etfGross - D.etfFees - D.etfTaxDrag;
  const cpi = (base, yrs) => base * Math.pow(1+D.cpiRate, yrs);
  function salaryGross(age, sal31, sal32, sal33, sal34, growth) {
    if (age===31) return sal31; if (age===32) return sal32; if (age===33) return sal33; if (age===34) return sal34;
    return sal34 * Math.pow(1+growth, age-34);
  }
  let offset = startOffset, etf = 0, superBal = D.superYou + D.superPartner, ipVal = 0, ipLoan = 0, ipEquity = 0, pporVal = D.pporPrice, remainLoan = loan;
  for (let age = D.startAge; age <= 65; age++) {
    const yrs = age - D.startAge;
    const grossYou = salaryGross(age, D.sal31, D.sal32, D.sal33, D.sal34, D.salGrowth);
    const grossWife = salaryGross(age, D.wifeSal31, D.wifeSal32, D.wifeSal33, D.wifeSal34, D.wifeSalGrowth);
    const totalInc = calcNetIncome(grossYou) + calcNetIncome(grossWife) + D.sideIncome*12;
    const totalOut = cpi(D.groceries+D.utilities+D.phone+D.streaming+D.clothing+D.eatOut+D.gifts+D.council+D.water+D.buildingIns+D.maintenance+D.strata+D.garden+D.otherHouse+D.carFuel+D.carIns+D.carRego+D.carService+D.carReplace+(age>=33?D.car2:0)+D.healthIns+D.lifeIns+D.incomeProtect+D.trauma, yrs)*12 + (D.travel+D.healthcare+D.christmas)*12 + (remainLoan>0?annualRepay:0);
    const netCash = totalInc - totalOut;
    offset += netCash;
    if (remainLoan>0) { const interest = remainLoan*D.mortgageRate; remainLoan = Math.max(0, remainLoan - (annualRepay-interest)); } else { etf += netCash; }
    superBal = (superBal + (grossYou+grossWife)*D.sgcRate) * (1+D.superReturn);
    pporVal *= (1+D.pporGrowth);
    rows.push({age, pporVal, etf, nw: Math.max(0,offset)+etf+(pporVal-remainLoan), superBal});
  }
  return rows;
}
function calcNetIncome(gross) { let tax = 0; if (gross <= 18200) tax = 0; else if (gross <= 45000) tax = (gross-18200)*0.19; else if (gross <= 120000) tax = 5092+(gross-45000)*0.325; else if (gross <= 180000) tax = 29467+(gross-120000)*0.37; else tax = 51667+(gross-180000)*0.45; tax += gross*0.02 - 700; return Math.max(0, gross - Math.max(0,tax)); }
function pmt(rate, nper, pv) { return pv*rate*Math.pow(1+rate,nper)/(Math.pow(1+rate,nper)-1); }
function vicStampDuty(price) { if (price <= 25000) return price*0.014; if (price <= 130000) return 350+(price-25000)*0.024; if (price <= 960000) return 2870+(price-130000)*0.06; if (price <= 2000000) return price*0.055; return price*0.065; }

function LifeResults(){
  const {D,update}=useLife();
  const [targetAge,setTargetAge]=useState(60);
  const rows1=useMemo(()=>computeLife({...D,strategy:1}),[D]);
  const rows2=useMemo(()=>computeLife({...D,strategy:2}),[D]);
  const rows3=useMemo(()=>computeLife({...D,strategy:3}),[D]);
  
  const getRow=(r,age)=>r.find(x=>x.age==age);
  
  return React.createElement('div',null,
    React.createElement('div',{className:'chart-card'},
      React.createElement('div',{className:'chart-title'},'Comparison: Passive Income Potential (3.5% SWR)'),
      React.createElement(ResponsiveContainer,{width:'100%',height:300},
        React.createElement(LineChart,{data:rows1.map((r,i)=>({age:r.age, s1:rows1[i].etf*0.035, s2:rows2[i].etf*0.035, s3:rows3[i].etf*0.035}))},
          React.createElement(CartesianGrid,{strokeDasharray:'3 3',stroke:'var(--border)'}),
          React.createElement(XAxis,{dataKey:'age',tick:{fill:'var(--text3)',fontSize:11}}),
          React.createElement(YAxis,{tickFormatter:v=>'$'+(v/1000).toFixed(0)+'k',tick:{fill:'var(--text3)',fontSize:11}}),
          React.createElement(Tooltip,{contentStyle:{background:'var(--surface2)'}}),
          React.createElement(Line,{dataKey:'s1',name:'1 · 100% Offset',stroke:'var(--blue)'}),
          React.createElement(Line,{dataKey:'s2',name:'2 · 50/50 ETF',stroke:'var(--gold)'}),
          React.createElement(Line,{dataKey:'s3',name:'3 · Inv. Property',stroke:'var(--green)'}),
          React.createElement(Legend)
        )
      )
    ),
    React.createElement('div',{className:'section-card', style:{padding:'1rem'}},
      React.createElement('label',{className:'input-label'},'Select Age for Milestone View: '),
      React.createElement('select',{className:'input-field', style:{width:'100px'}, value:targetAge, onChange:e=>setTargetAge(e.target.value)},
        [55,60].map(a=>React.createElement('option',{key:a,value:a},'Age '+a))
      ),
      React.createElement('div',{className:'stat-grid', style:{marginTop:'1rem'}},
        ['PPOR Value','ETF Balance','Net Worth (Excl. Super)'].map(label=>
          React.createElement('div',{key:label,className:'stat-card'},
            React.createElement('div',{className:'stat-label'},label),
            React.createElement('div',{className:'stat-value'},
              label==='PPOR Value'?fmtA(getRow(rows1,targetAge).pporVal):
              label==='ETF Balance'?fmtA(getRow(rows1,targetAge).etf):
              fmtA(getRow(rows1,targetAge).nw)
            )
          )
        )
      )
    )
  );
}

const LifeProvider=({children,startingCash})=>{
  const [D,setD]=useState(()=>{ try{const s=localStorage.getItem('FP_D');if(s)return JSON.parse(s);}catch(e){} return {...LIFE_DEFAULTS,totalCash:startingCash}; });
  useEffect(()=>{localStorage.setItem('FP_D',JSON.stringify(D));},[D]);
  return React.createElement(LC.Provider,{value:{D,setD,update:(k,v)=>setD(p=>({...p,[k]:v})),rows:[]}},children);
}
const useLife=()=>useContext(LC);
function LifePlanner({startingCash}){
  const [page,setPage]=useState(()=>localStorage.getItem('FP_Life_Tab') || 'assumptions');
  useEffect(()=>localStorage.setItem('FP_Life_Tab', page), [page]);
  return React.createElement(LifeProvider,{startingCash},
    React.createElement('nav',{className:'subnav'},
      React.createElement('button',{className:'subnav-btn'+(page==='assumptions'?' active':''),onClick:()=>setPage('assumptions')},'⚙️ Assumptions'),
      React.createElement('button',{className:'subnav-btn'+(page==='results'?' active':''),onClick:()=>setPage('results')},'📊 Results')
    ),
    page==='assumptions'?React.createElement(LifeAssumptions,null):React.createElement(LifeResults,null)
  );
}
const LifeAssumptions=()=>{ return React.createElement('p',null,'(Assumption UI content goes here)'); }
const fmtA=n=>n==null?'—':(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-AU',{maximumFractionDigits:0});

function initApp(){ ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App)); }
function LifePlannerConnected(){
  const {compute}=useFinance();
  const rows=useMemo(()=>compute(),[compute]);
  const last=rows[rows.length-1];
  const startingCash=Math.round((last.balA||0)+(last.balB||0));
  return React.createElement(LifePlanner,{startingCash});
}
