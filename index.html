<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FinancePlan 2028</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--t-xs:clamp(.65rem,1.2vw,.78rem);--t-sm:clamp(.78rem,1.5vw,.9rem);--t-base:clamp(.88rem,1.8vw,1rem);
--t-md:clamp(1rem,2.2vw,1.15rem);--t-lg:clamp(1.1rem,2.8vw,1.35rem);--t-xl:clamp(1.3rem,3.5vw,1.75rem);
--t-2xl:clamp(1.6rem,4.5vw,2.2rem);
--bg:#0b0e14;--bg2:#111620;--bg3:#181e2c;--surface:#1c2333;--surface2:#232b3e;
--border:#2a3448;--border2:#3a4560;--gold:#d4a843;--gold-dim:#a07c2a;--gold-glow:rgba(212,168,67,.15);
--green:#3ec97a;--red:#e05555;--blue:#4a9eff;--text:#e8ecf4;--text2:#9ba8c0;--text3:#5a6480;
--radius:.75rem;--radius-sm:.4rem;
}
body{font-family:'DM Sans',sans-serif;font-size:var(--t-base);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;background:rgba(11,14,20,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1400px;margin:0 auto;padding:.75rem clamp(1rem,4vw,2rem);display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.brand-icon{font-family:'Syne',sans-serif;font-size:var(--t-xl);color:var(--gold);line-height:1}
.brand-name{font-family:'Syne',sans-serif;font-size:var(--t-md);font-weight:700}
.brand-year{color:var(--gold)}
.desktop-nav{display:flex;gap:.5rem}
.nav-btn{font-family:'Syne',sans-serif;font-size:var(--t-sm);font-weight:600;padding:.4rem 1.2rem;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;color:var(--text2);cursor:pointer;transition:all .2s;letter-spacing:.04em}
.nav-btn:hover{color:var(--text);border-color:var(--border2)}
.nav-btn.active{background:var(--gold-glow);color:var(--gold);border-color:var(--gold-dim)}
.hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:.5rem}
.ham-line{display:block;width:22px;height:2px;background:var(--text2);border-radius:2px;transition:all .25s}
.mobile-menu{padding:.5rem clamp(1rem,4vw,2rem) 1rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:.25rem}
.mobile-nav-btn{font-family:'Syne',sans-serif;font-size:var(--t-md);font-weight:600;padding:.75rem 1rem;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text2);cursor:pointer;text-align:left}
.mobile-nav-btn.active{color:var(--gold);background:var(--gold-glow)}
.main-content{flex:1;max-width:1400px;margin:0 auto;width:100%;padding:clamp(1.5rem,4vw,2.5rem) clamp(1rem,4vw,2rem)}
.page-title{font-family:'Syne',sans-serif;font-size:var(--t-2xl);font-weight:800;margin-bottom:.4rem;line-height:1.1}
.page-subtitle{font-size:var(--t-sm);color:var(--text2);margin-bottom:2rem}
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1.25rem;overflow:hidden}
.section-header{display:flex;align-items:center;gap:.75rem;padding:.9rem clamp(1rem,3vw,1.5rem);background:var(--surface2);border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.section-header:hover{background:var(--bg3)}
.section-icon{width:2em;height:2em;background:var(--gold-glow);border:1px solid var(--gold-dim);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:var(--t-md);flex-shrink:0}
.section-title{font-family:'Syne',sans-serif;font-size:var(--t-md);font-weight:700;color:var(--gold);flex:1}
.section-chevron{color:var(--text3);font-size:var(--t-sm);transition:transform .25s;display:inline-block}
.section-body{padding:.9rem clamp(1rem,3vw,1.5rem) 1.25rem}
.input-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:1rem}
.input-sub-label{font-size:var(--t-sm);color:var(--text3);margin:1rem 0 .5rem;font-family:'Syne',sans-serif;font-weight:700;border-bottom:1px solid var(--border);padding-bottom:.25rem}
.input-group{display:flex;flex-direction:column;gap:.25rem}
.input-label{font-size:var(--t-xs);font-weight:500;color:var(--text2);letter-spacing:.05em;text-transform:uppercase}
.input-hint{font-size:var(--t-xs);color:var(--text3);margin-top:2px}
.input-wrap{position:relative}
.input-prefix{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--gold);font-size:var(--t-sm);pointer-events:none}
.input-field{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:var(--t-base);padding:.5rem .75rem;width:100%;transition:border-color .2s}
.input-field:focus{outline:none;border-color:var(--gold-dim)}
.input-field.has-prefix{padding-left:calc(.75rem*2 + .8em)}
.info-box{padding:.6rem 1rem;background:var(--bg2);border-radius:var(--radius-sm);border-left:3px solid var(--gold);margin-top:.75rem}
.info-box p{font-size:var(--t-xs);color:var(--text2)}
.cta-row{display:flex;justify-content:flex-end;margin-top:2rem}
.btn-primary{font-family:'Syne',sans-serif;font-size:var(--t-md);font-weight:700;padding:.7rem 2rem;background:var(--gold);color:#0b0e14;border:none;border-radius:var(--radius-sm);cursor:pointer;letter-spacing:.04em;transition:all .2s;box-shadow:0 0 24px var(--gold-glow)}
.btn-primary:hover{background:#e8bc55;transform:translateY(-1px)}
.subnav{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;border-bottom:1px solid var(--border);padding-bottom:1rem}
.subnav-btn{font-family:'Syne',sans-serif;font-size:var(--t-sm);font-weight:600;padding:.4rem 1rem;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .2s}
.subnav-btn:hover{color:var(--text);border-color:var(--border2)}
.subnav-btn.active{background:var(--gold);color:#0b0e14;border-color:var(--gold)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;display:flex;flex-direction:column;gap:.4rem}
.stat-card.highlight{border-color:var(--gold-dim);background:linear-gradient(135deg,var(--surface),var(--bg3));box-shadow:0 0 24px var(--gold-glow)}
.stat-label{font-size:var(--t-xs);color:var(--text2);text-transform:uppercase;letter-spacing:.06em}
.stat-value{font-family:'Syne',sans-serif;font-size:var(--t-xl);font-weight:700;line-height:1}
.stat-card.highlight .stat-value{color:var(--gold)}
.stat-sub{font-size:var(--t-xs);color:var(--text3)}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(.75rem,2vw,1.25rem);margin-bottom:1.25rem}
.chart-title{font-family:'Syne',sans-serif;font-size:var(--t-md);font-weight:700;margin-bottom:1rem}
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
.data-table{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
.data-table th{font-family:'Syne',sans-serif;font-size:var(--t-xs);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;padding:.55rem .8rem;background:var(--surface2);border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
.data-table th:first-child{text-align:left;position:sticky;left:0;background:var(--surface2);z-index:1}
.data-table td{padding:.4rem .8rem;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;color:var(--text2)}
.data-table td:first-child{text-align:left;color:var(--text);font-weight:500;position:sticky;left:0;background:var(--surface);z-index:1}
.data-table tr:hover td,.data-table tr:hover td:first-child{background:var(--surface2)}
.pos{color:var(--green)}.neg{color:var(--red)}.gold-t{color:var(--gold);font-weight:600}
.timeline{display:flex;flex-direction:column}
.tl-item{display:flex;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--border)}
.tl-item:last-child{border-bottom:none}
.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:6px}
.tl-dot.warn{background:var(--red)}.tl-dot.ok{background:var(--green)}
.tl-month{font-family:'Syne',sans-serif;font-size:var(--t-sm);font-weight:700;color:var(--gold);min-width:5rem;flex-shrink:0}
.tl-desc{font-size:var(--t-sm);color:var(--text2);line-height:1.5}
.nepal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:1rem;margin-bottom:1.25rem}
.nepal-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
.nc-label{font-size:var(--t-xs);color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.25rem}
.nc-nrs{font-family:'Syne',sans-serif;font-size:var(--t-lg);font-weight:700}
.nc-aud{font-size:var(--t-sm);color:var(--gold);margin-top:.2rem}
@media(max-width:768px){.desktop-nav{display:none}.hamburger{display:flex}.input-grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.stat-grid{grid-template-columns:1fr}.subnav-btn{font-size:var(--t-xs);padding:.35rem .6rem}.tl-month{min-width:4rem}}

/* Dynamic list rows */
.dyn-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(180px,100%),1fr));gap:.75rem;padding:.75rem;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:.5rem;align-items:end}
.btn-add{background:transparent;border:1px dashed var(--border2);color:var(--text2);border-radius:var(--radius-sm);padding:.5rem 1rem;font-size:var(--t-sm);cursor:pointer;width:100%;margin-top:.5rem;transition:all .2s;font-family:'DM Sans',sans-serif}
.btn-add:hover{border-color:var(--gold-dim);color:var(--gold)}
.btn-remove{background:transparent;border:1px solid var(--red);color:var(--red);border-radius:var(--radius-sm);padding:.4rem .75rem;font-size:var(--t-xs);cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.btn-remove:hover{background:var(--red);color:#fff}
.btn-fetch{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:.5rem 1rem;font-size:var(--t-sm);cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.btn-fetch:hover{border-color:var(--gold-dim);color:var(--gold)}
.btn-fetch:disabled{opacity:.5;cursor:not-allowed}
select.input-field{appearance:auto}

#login-screen{display:flex;min-height:100vh;align-items:center;justify-content:center;background:var(--bg)}
#app-screen{display:none}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;width:min(360px,92vw);box-shadow:0 8px 40px rgba(0,0,0,.5)}
.login-logo{text-align:center;margin-bottom:1.75rem}
.login-logo .logo-icon{font-size:2.5rem;color:var(--gold)}
.login-logo h1{font-family:'Syne',sans-serif;font-size:var(--t-xl);font-weight:800;color:var(--text);margin:.25rem 0 0}
.login-logo p{font-size:var(--t-xs);color:var(--text3);margin-top:.2rem}
.login-form{display:flex;flex-direction:column;gap:.9rem}
.login-label{display:block;font-size:var(--t-xs);font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem}
.login-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:var(--t-base);padding:.55rem .75rem}
.login-input:focus{outline:none;border-color:var(--gold-dim)}
.pw-wrap{position:relative}
.pw-wrap .login-input{padding-right:2.8rem}
.pw-toggle{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:1rem;line-height:1;padding:.25rem}
.login-err{color:var(--red);font-size:var(--t-xs);text-align:center;min-height:1.2em}
.login-btn{background:var(--gold);color:#0b0e14;border:none;border-radius:var(--radius-sm);padding:.8rem;font-family:'Syne',sans-serif;font-weight:700;font-size:var(--t-md);cursor:pointer;letter-spacing:.04em;width:100%;margin-top:.25rem}
.login-btn:hover{background:#e8bc55}
.dyn-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:.75rem;padding:.75rem;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:.5rem;align-items:end}
.btn-add{background:transparent;border:1px dashed var(--border2);color:var(--text2);border-radius:var(--radius-sm);padding:.5rem 1rem;font-size:var(--t-sm);cursor:pointer;width:100%;margin-top:.5rem;font-family:'DM Sans',sans-serif}
.btn-add:hover{border-color:var(--gold-dim);color:var(--gold)}
.btn-remove{background:transparent;border:1px solid var(--red);color:var(--red);border-radius:var(--radius-sm);padding:.4rem .75rem;font-size:var(--t-xs);cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-remove:hover{background:var(--red);color:#fff}
.btn-fetch{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:.5rem 1rem;font-size:var(--t-sm);cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-fetch:hover:not(:disabled){border-color:var(--gold-dim);color:var(--gold)}
.btn-fetch:disabled{opacity:.5;cursor:not-allowed}
select.input-field{appearance:auto}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">&#8371;</div>
      <h1>FinancePlan</h1>
      <p>Family &amp; Life Wealth Planner</p>
    </div>
    <div class="login-form">
      <div>
        <label class="login-label" for="inp-user">Username</label>
        <input class="login-input" id="inp-user" type="text" placeholder="ujjan" autocomplete="username"/>
      </div>
      <div>
        <label class="login-label" for="inp-pass">Password</label>
        <div class="pw-wrap">
          <input class="login-input" id="inp-pass" type="password" placeholder="password" autocomplete="current-password"/>
          <button class="pw-toggle" type="button" id="pw-btn" onclick="togglePw()">Show</button>
        </div>
      </div>
      <div class="login-err" id="login-err"></div>
      <button class="login-btn" type="button" onclick="doLogin()">Sign In</button>
    </div>
  </div>
</div>
<div id="app-screen"><div id="root"></div></div>
<script>
var _pwVisible=false;
function togglePw(){var i=document.getElementById('inp-pass'),b=document.getElementById('pw-btn');_pwVisible=!_pwVisible;i.type=_pwVisible?'text':'password';b.textContent=_pwVisible?'Hide':'Show';}
function doLogin(){var u=document.getElementById('inp-user').value.trim(),p=document.getElementById('inp-pass').value,err=document.getElementById('login-err');err.textContent='';if(u==='ujjan'&&p==='AbCd@1949'){document.getElementById('login-screen').style.display='none';document.getElementById('app-screen').style.display='block';if(!window._appMounted)initApp();}else{err.textContent='Invalid username or password';}}
document.addEventListener('DOMContentLoaded',function(){document.getElementById('inp-pass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});document.getElementById('inp-user').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('inp-pass').focus();});});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.2.0/Recharts.min.js"></script>
<script>

const {useState,useMemo,useEffect,useContext,createContext,useCallback}=React;
const {LineChart,Line,BarChart,Bar,XAxis,YAxis,CartesianGrid,Tooltip,Legend,
       ResponsiveContainer,ReferenceLine,Cell}=Recharts;

// ── Credentials ───────────────────────────────────────────────────────────
const CREDS={user:'ujjan',pass:'AbCd@1949'};

// ── Login ─────────────────────────────────────────────────────────────────
function Login({onLogin}){
  const [u,setU]=useState('');
  const [p,setP]=useState('');
  const [err,setErr]=useState('');
  const [show,setShow]=useState(false);
  function submit(e){
    e.preventDefault();
    if(u.trim()===CREDS.user && p===CREDS.pass) onLogin();
    else setErr('Invalid username or password');
  }
  const card={background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--radius)',
    padding:'2.5rem 2rem',width:'min(360px,92vw)',boxShadow:'0 8px 40px rgba(0,0,0,.5)'};
  return React.createElement('div',{style:{minHeight:'100vh',display:'flex',alignItems:'center',
      justifyContent:'center',background:'var(--bg)'}},
    React.createElement('div',{style:card},
      React.createElement('div',{style:{textAlign:'center',marginBottom:'2rem'}},
        React.createElement('div',{style:{fontSize:'2.5rem',color:'var(--gold)'}},'₳'),
        React.createElement('h1',{style:{fontFamily:"'Syne',sans-serif",fontSize:'var(--t-xl)',
          fontWeight:800,color:'var(--text)',margin:0}},'FinancePlan'),
        React.createElement('p',{style:{fontSize:'var(--t-xs)',color:'var(--text3)',marginTop:'.25rem'}},
          '2028 Family Wealth Planner')
      ),
      React.createElement('form',{onSubmit:submit,style:{display:'flex',flexDirection:'column',gap:'1rem'}},
        React.createElement('div',{className:'input-group'},
          React.createElement('label',{className:'input-label'},'Username'),
          React.createElement('input',{className:'input-field',type:'text',value:u,
            onChange:e=>setU(e.target.value),placeholder:'ujjan'})
        ),
        React.createElement('div',{className:'input-group'},
          React.createElement('label',{className:'input-label'},'Password'),
          React.createElement('div',{style:{position:'relative'}},
            React.createElement('input',{className:'input-field',type:show?'text':'password',value:p,
              onChange:e=>setP(e.target.value),placeholder:'••••••••',style:{paddingRight:'2.8rem'}}),
            React.createElement('button',{type:'button',
              onClick:()=>setShow(s=>!s),
              style:{position:'absolute',right:'.75rem',top:'50%',transform:'translateY(-50%)',
                background:'none',border:'none',color:'var(--text3)',cursor:'pointer',
                fontSize:'var(--t-md)',lineHeight:1}},show?'🙈':'👁')
          )
        ),
        err&&React.createElement('p',{style:{color:'var(--red)',fontSize:'var(--t-xs)',margin:0,
          textAlign:'center'}},err),
        React.createElement('button',{type:'submit',style:{marginTop:'.5rem',background:'var(--gold)',
          color:'#0b0e14',border:'none',borderRadius:'var(--radius-sm)',padding:'.8rem',
          fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:'var(--t-md)',cursor:'pointer',
          letterSpacing:'.04em'}},'Sign In →')
      )
    )
  );
}

// ── Defaults ──────────────────────────────────────────────────────────────
const DEFAULTS={
  dates:{yourSalRise:202607,wifeP2:202607,wifeP3:202707,extraEnd:202611,expDrop:202707,
    childcareStart:202707,ccsStart:202711,lodge485:202707,agentPay:202708,carMonth:202706,
    prGrant:202711,tuit1:202607,tuit2:202701,tax1:202607,tax2:202707,tax3:202807},
  income:{yourSalLow:800,yourSalHigh:1323,wifeP1:736,wifeP2:944,wifeP3:1500,extraYou:630,freelance:100},
  savings:{acctA:5500,acctB:11500,macRate:0.045},
  expenses:{expWk:1300,expWkPost:950,carCost:10000,carRun:175},
  childcare:{dailyRate:180,discount:0.30,ccsRate:0.72,days:5},
  tax:{taxFree:18200,r1:0.19,r2:0.325,r3:0.37,lmito:1500,medicare:0.02},
  nepal:{noInt:40,fixed12:20,mktYou:30,mktWife:10,nrsRate:0.04,exchange:95,exchangeAuto:false,exchangeLoading:false},
  oneoff:{tuit1:9500,tuit2:9500,v485pri:4770,v485sec:2385,v485adm:500,oshc:1200,
    skills:600,english:400,police:200,medicals:600,agent:3000,skills2:300,prPri:4640,prSec:2330,stateNom:300},
  extraIncomes:[],
  extraExpenses:[],
  extraOneoffs:[]
};

// ── Context ───────────────────────────────────────────────────────────────
const FC=createContext(null);
function FinanceProvider({children}){
  const [A,setA]=useState(DEFAULTS);
  const update=useCallback((sec,key,val)=>setA(p=>({...p,[sec]:{...p[sec],[key]:val}})),[]);
  const WPM=365.25/12/7;

  const fetchRate=useCallback(async()=>{
    update('nepal','exchangeLoading',true);
    try{
      const r=await fetch('https://api.exchangerate-api.com/v4/latest/AUD');
      if(r.ok){const d=await r.json();if(d.rates&&d.rates.NPR){
        const rate=parseFloat(d.rates.NPR.toFixed(2));
        setA(p=>({...p,nepal:{...p.nepal,exchange:rate,exchangeAuto:true,exchangeLoading:false}}));

  extraExpense: [],   // {id, label, ageFrom, ageTo, monthlyAmount, cpiLinked}

// ── Tax calc (ATO 2025-26) ────────────────────────────────────────────────
function calcNetIncome(gross) {
  let tax = 0;
  if (gross <= 18200) tax = 0;
  else if (gross <= 45000) tax = (gross-18200)*0.19;
  else if (gross <= 120000) tax = 5092+(gross-45000)*0.325;
  else if (gross <= 180000) tax = 29467+(gross-120000)*0.37;
  else tax = 51667+(gross-180000)*0.45;
  tax += gross*0.02 - 700; // medicare - LITO approx
  return Math.max(0, gross - Math.max(0,tax));
}

// ── PMT formula ───────────────────────────────────────────────────────────
function pmt(rate, nper, pv) {
  if (rate===0) return pv/nper;
  return pv*rate*Math.pow(1+rate,nper)/(Math.pow(1+rate,nper)-1);
}

// VIC Stamp Duty
function vicStampDuty(price) {
  if (price <= 25000) return price*0.014;
  if (price <= 130000) return 350+(price-25000)*0.024;
  if (price <= 960000) return 2870+(price-130000)*0.06;
  if (price <= 2000000) return price*0.055;
  return price*0.065;
}

// ── Main compute ──────────────────────────────────────────────────────────
function computeLife(D) {
  const rows = [];
  const stamp = vicStampDuty(D.pporPrice);
  const deposit = D.pporPrice * D.depositPct;
  const loan = D.pporPrice - deposit;
  const totalCosts = deposit + stamp + D.legal;
  const startOffset = D.totalCash - totalCosts;
  const annualRepay = pmt(D.mortgageRate/12, D.mortgageTerm*12, loan)*12;
  const etfNet = D.etfGross - D.etfFees - D.etfTaxDrag;

  // CPI helper
  const cpi = (base, yrs) => base * Math.pow(1+D.cpiRate, yrs);

  // Salary for age
  function salaryGross(age) {
    if (age===31) return D.sal31;
    if (age===32) return D.sal32;
    if (age===33) return D.sal33;
    if (age===34) return D.sal34;
    return D.sal34 * Math.pow(1+D.salGrowth, age-34);
  }

  // Child expense for age (uziel born uzielBirthYear)
  function childMonthly(age, yrs) {
    const uzielAge = age - (D.startAge - 31) + 31 - (2028 - D.uzielBirthYear);
    // simpler: uziel is ~5 in 2028 (born 2023)
    const ua = 2028 + (age - 31) - D.uzielBirthYear;
    if (ua < 4) return cpi(D.kidsActivities, yrs)*12;
    if (ua <= 5) return cpi(D.childcare + D.kidsActivities, yrs)*12;
    if (ua <= 12) return cpi(D.primary + D.kidsActivities, yrs)*12;
    if (ua <= 17) return cpi(D.highSchool + D.kidsActivities, yrs)*12;
    return D.uzielETF*12; // flat $250/mo for uziel ETF
  }

  const coreMonthly = D.groceries+D.utilities+D.phone+D.streaming+D.clothing+D.eatOut+D.gifts;
  const propMonthly = D.council+D.water+D.buildingIns+D.maintenance+D.strata+D.garden+D.otherHouse;
  const veh1Monthly = D.carFuel+D.carIns+D.carRego+D.carService+D.carReplace;
  const insMonthly  = D.healthIns+D.lifeIns+D.incomeProtect+D.trauma;
  const savMonthly  = D.travel+D.healthcare+D.christmas;

  // Life event map
  const lecMap = {};
  (D.lifeEvents||[]).forEach(e=>{ lecMap[e.age]=(lecMap[e.age]||0)+e.amount; });
  // Extra income/expense by age
  const extraIncMap = {};
  const extraExpMap = {};
  (D.extraIncome||[]).forEach(r=>{
    for(let a=r.ageFrom;a<=r.ageTo;a++){extraIncMap[a]=(extraIncMap[a]||0)+r.monthlyAmount*12;}
  });
  (D.extraExpense||[]).forEach(r=>{
    for(let a=r.ageFrom;a<=r.ageTo;a++){extraExpMap[a]=(extraExpMap[a]||0)+r.monthlyAmount*12;}
  });

  let offset = startOffset;
  let etf = 0;
  let superBal = D.superYou + D.superPartner;
  let ipVal = 0, ipLoan = 0, ipEquity = 0;
  let pporVal = D.pporPrice;
  let remainLoan = loan;

  for (let age = D.startAge; age <= 65; age++) {
    const year = 2028 + (age - D.startAge);
    const yrs = age - D.startAge;

    const grossSal = salaryGross(age);
    const netEach = calcNetIncome(grossSal);
    const totalIncome = netEach * 2 + D.sideIncome*12 + (extraIncMap[age]||0);
    const sgcEach = grossSal * D.sgcRate;

    const core = cpi(coreMonthly,yrs)*12;
    const prop = cpi(propMonthly,yrs)*12;
    const veh = age>=33 ? cpi(veh1Monthly+D.car2,yrs)*12 : cpi(veh1Monthly,yrs)*12;
    const ins = cpi(insMonthly,yrs)*12;
    const sav = savMonthly*12; // not CPI'd per model
    const child = childMonthly(age, yrs);
    const extraExp = extraExpMap[age]||0;
    const mort = remainLoan>0 ? annualRepay : 0;

    // IP in Strategy 3
    let ipTopup = 0;
    if (D.strategy===3 && age>=D.ipPurchaseAge) {
      if (ipLoan===0 && age===D.ipPurchaseAge) {
        const ipDep = D.ipPrice*D.ipDepositPct;
        const ipStamp = vicStampDuty(D.ipPrice);
        ipLoan = D.ipPrice - ipDep;
        ipVal = D.ipPrice;
        offset -= (ipDep+ipStamp+D.ipLegal);
      }
      const ipRent = ipVal*D.ipGrossYield;
      const ipInt = ipLoan*D.ipLoanRate;
      const ipCF = ipRent - ipInt - D.ipExpenses;
      if (ipCF<0) ipTopup = -ipCF;
      ipVal *= (1+D.ipGrowth);
      ipEquity = ipVal - ipLoan;
    }

    const totalOut = core+prop+veh+ins+sav+child+mort+ipTopup+extraExp;
    const grossSurplus = totalIncome - totalOut;
    const lec = lecMap[age]||0;
    const netCash = grossSurplus - lec;

    // Balance updates
    if (D.strategy===1) {
      // All surplus to offset
      if (remainLoan>0) {
        offset += netCash;
        // Principal reduction
        const interest = remainLoan*D.mortgageRate;
        const principal = mort - interest;
        remainLoan = Math.max(0, remainLoan - principal);
        if (offset > remainLoan) { remainLoan=0; offset -= remainLoan; }
      } else {
        etf += netCash;
      }
    } else if (D.strategy===2) {
      // 50/50
      const half = netCash/2;
      offset += half;
      etf = (etf+half)*(1+etfNet);
      const interest = remainLoan*D.mortgageRate;
      const principal = mort - interest;
      remainLoan = Math.max(0, remainLoan - principal);
    } else {
      // Strategy 3 - IP
      offset += netCash;
      const interest = remainLoan*D.mortgageRate;
      const principal = mort - interest;
      remainLoan = Math.max(0, remainLoan - principal);
    }

    // ETF growth on existing balance (S1: after debt-free)
    if (D.strategy!==2) etf *= (1+etfNet);

    // Super
    superBal = (superBal + sgcEach*2) * (1+D.superReturn);

    // PPOR value
    pporVal *= (1+D.pporGrowth);

    const nw = Math.max(0,offset) + etf + (age>=D.preservationAge?superBal:0) + ipEquity;
    const nwTotal = Math.max(0,offset) + etf + superBal + pporVal - remainLoan + ipEquity;
    const passiveIncome = etf*D.etfSWR + (age>=D.preservationAge ? superBal*D.superSWR : 0);

    rows.push({age,year,grossSal,netEach,totalIncome,core,prop,veh,ins,sav,child,extraExp,
      mort,ipTopup,totalOut,grossSurplus,lec,netCash,offset:Math.max(0,offset),
      remainLoan,etf,superBal,pporVal,ipVal,ipEquity,nw,nwTotal,passiveIncome,sgcEach});
  }
  return rows;
}

// ── Life Planner Root ─────────────────────────────────────────────────────
function LifePlanner({startingCash}){
  const [page,setPage]=useState('assumptions');
  return React.createElement(LifeProvider,{startingCash},
    React.createElement('div',null,
      React.createElement('nav',{className:'subnav',style:{marginBottom:'0'}},
        React.createElement('button',{className:'subnav-btn'+(page==='assumptions'?' active':''),onClick:()=>setPage('assumptions')},'⚙️ Assumptions'),
        React.createElement('button',{className:'subnav-btn'+(page==='results'?' active':''),onClick:()=>setPage('results')},'📊 Results')
      ),
      React.createElement('div',{style:{marginTop:'1.5rem'}},
        page==='assumptions'&&React.createElement(LifeAssumptions,null),
        page==='results'&&React.createElement(LifeResults,null)
      )
    )
  );
}

const fmtA=n=>n==null?'—':(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-AU',{maximumFractionDigits:0});
