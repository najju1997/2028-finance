<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FinancePlan 2028</title>
<link rel="stylesheet" href="css/styles.css?v=1">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<script>try{var t=localStorage.getItem('FP_Theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>

</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">&#8371;</div>
      <h1>FinancePlan</h1>
      <p>Family &amp; Life Wealth Planner</p>
    </div>
    <div class="login-form">
      <div>
        <label class="login-label" for="inp-email">Email</label>
        <input class="login-input" id="inp-email" type="email" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div>
        <label class="login-label" for="inp-pass">Password</label>
        <div class="pw-wrap">
          <input class="login-input" id="inp-pass" type="password" placeholder="••••••••" autocomplete="current-password"/>
          <button class="pw-toggle" type="button" id="pw-btn" onclick="togglePw()">Show</button>
        </div>
      </div>
      <div class="login-msg" id="login-msg"></div>
      <button class="login-btn" type="button" id="login-btn" onclick="doAuth()">Sign In</button>
      <div class="login-toggle">
        <span id="login-toggle-text">First time?</span>
        <a id="login-toggle-link" onclick="toggleMode()">Create account</a>
      </div>
    </div>
  </div>
</div>
<div id="app-screen"><div id="root"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ─── Supabase setup ──────────────────────────────────────────────────────
const SUPABASE_URL = 'https://qglwcaxfwbofstaxzzvb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cyN019dDWoyecfjrp755ag_4yBT3WMM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
});
window._sb = sb;

// ─── Login screen logic ──────────────────────────────────────────────────
var ALLOWED_EMAILS = ['uzzan.blue@gmail.com','ujjanprajapati@gmail.com','salonimhzn@gmail.com'];
var _pwVisible = false;
var _mode = 'signin'; // 'signin' | 'signup'

function togglePw(){
  var i = document.getElementById('inp-pass'), b = document.getElementById('pw-btn');
  _pwVisible = !_pwVisible;
  i.type = _pwVisible ? 'text' : 'password';
  b.textContent = _pwVisible ? 'Hide' : 'Show';
}

function toggleMode(){
  _mode = _mode === 'signin' ? 'signup' : 'signin';
  document.getElementById('login-btn').textContent = _mode === 'signin' ? 'Sign In' : 'Create Account';
  document.getElementById('login-toggle-text').textContent = _mode === 'signin' ? 'First time?' : 'Already have an account?';
  document.getElementById('login-toggle-link').textContent = _mode === 'signin' ? 'Create account' : 'Sign in';
  setMsg('','');
}

function setMsg(text, cls){
  var m = document.getElementById('login-msg');
  m.textContent = text;
  m.className = 'login-msg' + (cls ? ' ' + cls : '');
}

async function doAuth(){
  var email = document.getElementById('inp-email').value.trim().toLowerCase();
  var pass = document.getElementById('inp-pass').value;
  var btn = document.getElementById('login-btn');
  if(!email || !pass){ setMsg('Email and password required','err'); return; }
  if(!ALLOWED_EMAILS.includes(email)){ setMsg('Access restricted.','err'); return; }
  if(_mode === 'signup' && pass.length < 6){ setMsg('Password must be at least 6 characters','err'); return; }
  btn.disabled = true;
  setMsg(_mode === 'signin' ? 'Signing in…' : 'Creating account…','');
  try {
    var result;
    if(_mode === 'signin'){
      result = await sb.auth.signInWithPassword({ email, password: pass });
    } else {
      result = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: 'https://uzzsalfinance.vercel.app' } });
    }
    if(result.error){ setMsg(result.error.message,'err'); btn.disabled = false; return; }
    if(_mode === 'signup' && !result.data.session){
      setMsg('Account created. Check your email to confirm, then sign in.','ok');
      btn.disabled = false;
      _mode = 'signin';
      document.getElementById('login-btn').textContent = 'Sign In';
      return;
    }
    onAuthSuccess();
  } catch(e){
    setMsg('Network error: ' + (e.message||e),'err');
    btn.disabled = false;
  }
}

function onAuthSuccess(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  if(!window._appMounted) initApp();
}

// Check for existing session on load
document.addEventListener('DOMContentLoaded', async function(){
  document.getElementById('inp-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') doAuth(); });
  document.getElementById('inp-email').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('inp-pass').focus(); });
  try {
    var { data } = await sb.auth.getSession();
    if(data && data.session){
      var sessionEmail = (data.session.user.email || '').toLowerCase();
      if(ALLOWED_EMAILS.includes(sessionEmail)){ onAuthSuccess(); }
      else { await sb.auth.signOut(); }
    }
  } catch(e){ console.warn('Session check failed:', e); }
});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.2.0/Recharts.min.js"></script>
<script src="js/00-icons.js?v=1"></script>
<script src="js/01-engine.js?v=1"></script>
<script src="js/02-family-plan.js?v=1"></script>
<script src="js/03-life-plan.js?v=1"></script>
<script src="js/04-cashflow.js?v=1"></script>
<script src="js/05-analysis.js?v=1"></script>
<script src="js/06-app.js?v=1"></script>
</body>
</html>
